# Lina – Anruf 1 (Datenerfassung): Szenarien mit festem Kandidaten und Endzustands-Prüfung.
# GPT-Live ist audio-only → im AUDIO-Modus ausführen:
#   lk agent simulate audio --scenarios scenarios.yaml
# Der Kandidat kommt aus `userdata` (kein Airtable-Zugriff in Simulationen), die Uhr ist fixiert.
# `expected_state` wird in on_simulation_end geprüft (src/lina/simulacija.py).
id: SCNG_iZRYj1MgANOk
name: Lina – Anruf 1 Datenerfassung
scenarios:
  - id: SCN_ulkbtr58v3dF
    label: Fragt nur, was fehlt
    instructions: |
      PERSONA: Amir, 34, Maurer aus Bihać. Du sprichst Bosnisch, freundlich, kurz.
      OPENING LINE: "Halo?"
      DO, IN ORDER:
      1. Bestätige, dass du Zeit hast.
      2. Beantworte nur, was gefragt wird: Aufenthaltsstatus "živim u BiH", Englisch "malo, osnove", Kinder "da, dvoje, četiri i devet godina".
      3. Wenn nach etwas anderem gefragt wird (Staatsbürgerschaft, Führerschein, E-Mail, Arbeit, Schule), antworte "to sam već poslao u prijavi".
      4. Verabschiede dich, wenn Lina sich verabschiedet.
    agent_expectations: >
      Lina speaks Bosnian (ijekavian, informal "ti"), one short question at a time. She asks about
      residence status, English level and children. She may ask ONCE whether there is more work
      experience or schooling besides what is on file, and accepts "already in the application"
      immediately without insisting. She does NOT ask about citizenship, driving licence,
      e-mail, work experience or school, because these are already on file. She asks for no documents.
    tags:
      feature: samo_prazno
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Amir
        drzavljanstvo: BiH
        vozacka: "B, C"
        radna_dozvola: Nema
        datum_rodjenja: "15.03.1992"
        mjesto_rodjenja: Bihać
        adresa: "Bosanska 12, 77000 Bihać"
        bracno_stanje: Oženjen/Udata
        email: amir.test@example.com
        vjestine: "Zidanje, malterisanje"
        njemacki: Osnove
      radno_iskustvo:
        - {pozicija: Zidar, poslodavac: Hidrogradnja, od: "2015-01-01", do: "2025-12-31", aktuelno: true}
      obrazovanje:
        - {skola: "MSŠ Bihać", od: "2007-09-01", do: "2010-06-30"}
      expected_state:
        sacuvano: [status_boravka, engleski, djeca]
        nije_sacuvano: [drzavljanstvo, vozacka, email, radna_dozvola, adresa]
        broj_novih_radnih_mjesta: 0
        broj_novih_skola: 0

  - id: SCN_0eEK49lEk1Jy
    label: Offene Dopune zählt als vorhanden
    instructions: |
      PERSONA: Edin, Fahrer, spricht Bosnisch.
      OPENING LINE: "Da, izvolite."
      DO, IN ORDER:
      1. Hab Zeit. Beantworte jede Frage kurz und plausibel (Englisch: nema; Kinder: ne).
      2. Wenn Lina nach dem Aufenthaltsstatus fragt, sage "to sam vam već poslao preko linka".
    agent_expectations: >
      Lina does not ask about residence status, because it is already waiting in a submitted update.
      She asks only for the remaining missing items, one at a time, in Bosnian.
    tags:
      feature: dopune
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Edin
        drzavljanstvo: BiH
        vozacka: "B, C, CE"
        radna_dozvola: Nema
        datum_rodjenja: "02.02.1988"
        mjesto_rodjenja: Cazin
        adresa: "Cazinska 3, 77220 Cazin"
        bracno_stanje: Neoženjen/Neudata
        email: edin.test@example.com
        vjestine: "Vožnja kamiona"
        njemacki: Nema
      radno_iskustvo:
        - {pozicija: Vozač kamiona, poslodavac: Trans d.o.o., od: "2012-03-01", do: "2025-10-31"}
      obrazovanje:
        - {skola: "Saobraćajna škola Cazin", od: "2003-09-01", do: "2006-06-30"}
      dopune:
        - {status_pregleda: Novo, status_boravka: BiH}
      expected_state:
        nije_sacuvano: [status_boravka]
        sacuvano: [engleski, djeca]

  - id: SCN_hFrI3BcY7SHV
    label: Drei Berufsstationen nacheinander, einzeln bestätigt
    instructions: |
      PERSONA: Senad, 38, Bauarbeiter, spricht Bosnisch.
      OPENING LINE: "Halo, ko je to?"
      DO, IN ORDER:
      1. Hab Zeit.
      2. Berufserfahrung, eine Station pro Antwort, neueste zuerst:
         a) Zidar, "Euro-Asfalt", Sarajevo, BiH, od 2019 do danas
         b) Pomoćni radnik, "Gradnja d.o.o.", Tuzla, BiH, 2014 do 2018
         c) Armirač, "Bau GmbH", München, Njemačka, 2011 do 2013
         Danach: "To je sve."
      3. Bestätige jede Wiederholung mit "da, tako je".
      4. Alle anderen Fragen kurz und plausibel beantworten.
    agent_expectations: >
      Lina asks for work experience station by station, starting with the current job, and asks
      whether there was a job before that (e.g. "A prije toga?", wording may vary) until the
      candidate says there is nothing more. After EACH station she repeats only
      that one station and asks for confirmation; she never reads several stations back at once.
    tags:
      feature: radno_iskustvo
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Senad
        drzavljanstvo: BiH
        datum_rodjenja: "10.05.1988"
      expected_state:
        broj_novih_radnih_mjesta: 3
        nije_sacuvano: [drzavljanstvo]

  - id: SCN_VW5KEQdECBNw
    label: Überschneidung – genau eine Rückfrage
    instructions: |
      PERSONA: Haris, Maurer, spricht Bosnisch.
      OPENING LINE: "Halo?"
      DO, IN ORDER:
      1. Hab Zeit.
      2. Berufserfahrung: zuerst "Firma Gradit, zidar, od 2013 do 2017", dann "Firma Beton, zidar, od 2010 do 2015", dann "to je sve".
      3. Wenn Lina nach der Überschneidung fragt: "Da, to je bilo paralelno, vikendom sam radio za Beton."
      4. Alle anderen Fragen kurz und plausibel beantworten.
    agent_expectations: >
      After both jobs are confirmed, Lina notices that 2010–2015 and 2013–2017 overlap and asks about it
      exactly ONCE, politely, in Bosnian. She accepts the explanation and does not ask about the overlap again.
    tags:
      feature: plausibilitaet
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Haris
        drzavljanstvo: BiH
        datum_rodjenja: "01.01.1985"
      expected_state:
        broj_novih_radnih_mjesta: 2
        napomena_provjere: "L1"

  - id: SCN_1Miog2pbTNGZ
    label: Keine Zeit – Rückruf morgen
    instructions: |
      PERSONA: Mirza, gerade auf der Baustelle, spricht Bosnisch.
      OPENING LINE: "Halo, na poslu sam."
      DO, IN ORDER:
      1. Sage, dass du jetzt keine Zeit hast.
      2. Schlage vor: "Nazovite me sutra poslije četiri popodne."
      3. Bestätige den Termin, wenn Lina ihn wiederholt, und verabschiede dich.
    agent_expectations: >
      Lina does not start collecting data. She agrees on a callback, repeats it as tomorrow, Friday
      6 November, at around four in the afternoon, thanks the candidate and ends the call politely.
    tags:
      feature: povratni_poziv
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Mirza
      expected_state:
        povratni_poziv: true
        ishod: povratni_poziv

  - id: SCN_0dUUXmGe2zsW
    label: Opt-out sofort respektieren
    instructions: |
      PERSONA: Genervter Kandidat, spricht Kroatisch (hrvatski).
      OPENING LINE: "Halo?"
      DO, IN ORDER:
      1. Nach der Begrüßung: "Ne zanima me više, nemojte me više zvati."
      2. Verabschiede dich.
    agent_expectations: >
      Lina immediately respects the request, asks no further questions, thanks the candidate briefly
      and ends the call.
    tags:
      feature: opt_out
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Test
      expected_state:
        ishod: ne_zovite_vise
        broj_novih_radnih_mjesta: 0

  - id: SCN_zcjCISqHZR87
    label: Führerschein umgangssprachlich – richtige Kategorie
    instructions: |
      PERSONA: Kemal, LKW-Fahrer, spricht Bosnisch.
      OPENING LINE: "Halo."
      DO, IN ORDER:
      1. Hab Zeit.
      2. Auf die Frage nach dem Führerschein: "Imam za auto i za kamion sa prikolicom."
      3. Bestätige, wenn Lina die Kategorien nennt.
      4. Alle anderen Fragen kurz und plausibel beantworten.
    agent_expectations: >
      Lina maps the answer to driving-licence categories (B and CE), repeats them for confirmation in
      Bosnian, and moves on.
    tags:
      feature: feldwerte
    userdata:
      sada: "2026-11-05T10:00"
      kandidat:
        ime: Kemal
        drzavljanstvo: BiH
      expected_state:
        sacuvano: [vozacka]
